name: check

on:
   pull_request:
   push:
      branches: [main]

jobs:
   check:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v5
         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: 1.4.5
         - run: bun install --frozen-lockfile
         # Ubuntu's AppArmor bars the user namespace systemd --user needs for the driver's ReadOnlyPaths (tools/driver/service/service.test.ts)
         - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
         # tools/driver/world/core.test.ts skips its terminal test here: herdr-core's hc has no public release to install
         - run: bun run check
